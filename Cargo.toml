[package]
name = "oblion"
version = "0.1.1"
edition = "2021"
description = "Outil portable d'effacement sécurisé de disques (HDD/SSD) avec certificat PDF"
license = "MIT"
publish = false

[dependencies]
barcoders = { version = "2.0.0", default-features = false, features = ["std"] }
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "canvas", "crisp"] }
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
toml_edit = "0.25.19"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Interface graphique : iced, rendu logiciel tiny-skia UNIQUEMENT (aucun backend GPU : WinPE)

[build-dependencies]
# Icône .ico générée depuis assets/oblion-logo.svg (entrée 256 px en PNG) et ressources
# Windows (icône + VERSIONINFO) compilées par rc.exe du Windows SDK.
png = "0.18.1"
winresource = { version = "0.1.34", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# panic = "unwind" (défaut) : en cas de panique, les gardes s'exécutent
# (remise en ligne du disque, déverrouillage des volumes).
